name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Require tag to match package version
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match package ' + p.version); process.exit(1) }"
      - run: npm ci
      # `npm test` already builds `lib/`; building again would only repeat work.
      - run: npm test
      # `publishConfig.provenance` in package.json enables provenance; passing
      # `--provenance` here as well would state the same flag twice.
      - name: Publish to npm with provenance
        run: npm publish
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
