name: publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Resolve version and release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          package="$(node -p "require('./package.json').name")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          if npm view "${package}@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${package}@${version} already exists on npm; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and test
        if: steps.release.outputs.published == 'false'
        run: |
          npm ci
          npm test
      - name: Publish to npm with provenance
        if: steps.release.outputs.published == 'false'
        # 版本线重编后新版本可能低于已发布版本；显式指定 latest，避免 npm 因隐式标签报错。
        run: npm publish --tag latest
      - name: Ensure tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"


  cleanup-001:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Remove 0.0.1 from npm
        run: |
          set -euo pipefail
          package="$(node -p "require('./package.json').name")"
          if ! npm view "${package}@0.0.1" version >/dev/null 2>&1; then
            echo "::notice::${package}@0.0.1 is already absent"
            exit 0
          fi
          escaped="${package/\//%2F}"
          id_http="$(curl -sS -o /tmp/id.json -w '%{http_code}' -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" || true)"
          echo "::warning::oidc_http=${id_http} body=$(head -c 300 /tmp/id.json | tr '\n' ' ')"
          id_token="$(node -e "const j=require('/tmp/id.json');if(!j.value)process.exit(1);process.stdout.write(j.value)")"
          ex_http="$(curl -sS -o /tmp/ex.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${id_token}" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${escaped}" || true)"
          echo "::warning::exchange_http=${ex_http} body=$(head -c 300 /tmp/ex.json | tr '\n' ' ')"
          npm_token="$(node -e "const j=require('/tmp/ex.json');if(!j.token)process.exit(1);process.stdout.write(j.token)")"
          npm config set "//registry.npmjs.org/:_authToken" "${npm_token}" --location=user
          set +e
          out="$(npm unpublish "${package}@0.0.1" --force 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::unpublish_exit=${code} output=$(printf '%s' "$out" | head -c 800 | tr '\n' ' ')"
            exit "$code"
          fi
      - name: Remove 0.0.1 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.0.1 >/dev/null 2>&1; then
            gh release delete v0.0.1 --yes --cleanup-tag
          fi
          git push origin :refs/tags/v0.0.1 || true
