name: publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Resolve version and release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          package="$(node -p "require('./package.json').name")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          if npm view "${package}@${version}" version --prefer-online >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${package}@${version} already exists on npm; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and test
        if: steps.release.outputs.published == 'false'
        run: |
          npm ci
          npm test
      - name: Publish to npm with provenance
        if: steps.release.outputs.published == 'false'
        # main 推送与手动标签推送可能同时触发发布；后到的 run 可能读到缓存里的旧状态，
        # 发布时才发现版本已被并发发布。此时只要版本已进 registry，就按成功处理。
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if npm publish --tag latest; then
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            if npm view "${PACKAGE}@${VERSION}" version --prefer-online >/dev/null 2>&1; then
              echo "::notice::${PACKAGE}@${VERSION} is already on npm; a concurrent run published it"
              exit 0
            fi
            sleep 10
          done
          echo "::error::npm publish failed and ${PACKAGE}@${VERSION} is still absent"
          exit 1
      - name: Ensure tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"

