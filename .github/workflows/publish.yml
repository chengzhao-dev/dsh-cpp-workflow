name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Require tag to match package version
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match package ' + p.version); process.exit(1) }"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance
